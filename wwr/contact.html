<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Us | White Water Rafting (WWR)</title>
    <meta name="description"
      content="Contact White Water Rafting (WWR) for reservations, general inquiries, or website suggestions. Find our address, phone number, map, and staff profiles." />
    <meta name="author" content="Aine Villegas" />
    <link rel="stylesheet" href="styles/rafting.css" />
</head>

<body>
    <header>
        <a class="logo" href="index.html">
            <img src="images/logoboat.png" alt="White Water Rafting logo" width="100"
              height="100" />
        </a>

        <nav aria-label="Primary navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li>
                    <a href="contact.html" aria-current="page">Contact Us</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- COMPANY INFO -->
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>

            <p>
                123 Main River Street<br />
                Kolob, California<br />
                📞 +1 (999) 999-9999<br />
                ✉ info@whitewater.com
            </p>
        </section>

        <!-- MAP + FORM -->
        <section class="contact-grid">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.835434509374!2d-122.41941548468124!3d37.774929679759504!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085808c2f6e2f45%3A0x4e5f09f6dfb1eb0!2sCalifornia!5e0!3m2!1sen!2sus!4v000000000"
                  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                  title="White Water Rafting location map"></iframe>
            </div>

            <form class="contact-form" action="#" method="post">
                <fieldset>
                    <legend>Get in Touch</legend>

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required autocomplete="name" />

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" />

                    <p>Message Purpose</p>

                    <label for="purpose-general">
                        <input type="radio" name="purpose" id="purpose-general" value="general"
                          required />
                        General Inquiry
                    </label>

                    <label for="purpose-reservation">
                        <input type="radio" name="purpose" id="purpose-reservation"
                          value="reservation" />
                        Reservation Question
                    </label>

                    <label for="purpose-website">
                        <input type="radio" name="purpose" id="purpose-website" value="website" />
                        Website Suggestion
                    </label>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" required></textarea>

                    <label class="checkbox" for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes" />
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>
                </fieldset>
            </form>
        </section>

        <!-- EMPLOYEES -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">
                <figure>
                    <img src="images/profile2.jpg" alt="Employee profile photo" />
                    <figcaption>River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/profile3.jpg" alt="Employee profile photo" />
                    <figcaption>Trip Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/profile4.jpg" alt="Employee profile photo" />
                    <figcaption>Safety Instructor</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting (WWR) • Aine Villegas</p>

        <nav class="socialmedia" aria-label="Social media links">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.png" alt="Facebook" />
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.png" alt="Instagram" />
            </a>
            <a href="https://twitter.com" target="_blank" rel="noopener">
                <img src="images/xtwitter.png" alt="X" />
            </a>
        </nav>
    </footer>
</body>

</html>
